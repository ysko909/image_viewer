{% extends 'layout.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container text-center mt-4">
    <h2 id="filename-display" class="mb-3"></h2>

    <div class="slideshow-container position-relative d-inline-block">
        {# メディア表示エリア #}
        <div id="media-wrapper" style="max-height: 75vh; border-radius: 8px; overflow: hidden; display: inline-block;">
            <a id="image-link" href="">
                <img id="slideshow-image" src="" alt="Slideshow Image" class="img-fluid" style="max-height: 75vh; border-radius: 8px;">
            </a>
            <video id="slideshow-video" src="" playsinline webkit-playsinline autoplay muted preload="auto" class="img-fluid d-none" style="max-height: 75vh; border-radius: 8px;"></video>
        </div>

        {# 前へボタン #}
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        {# 次へボタン #}
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>

    <div class="mt-3">
        <button id="toggle-play" class="btn btn-secondary">一時停止</button>
        <a href="{{ url_for('image_list') }}" class="btn btn-primary">一覧に戻る</a>
    </div>
</div>

{# スライドショーのデータをJSONとして埋め込む #}
<script id="slideshow-data" type="application/json">
{{ {
    "image_files": image_files,
    "start_index": start_index,
    "duration": slideshow_duration,
    "loop": slideshow_loop,
    "base_img_url": url_for('static', filename='img/')
} | tojson }}
</script>

<script>
    // --- DOM要素の取得 ---
    const imageElement = document.getElementById('slideshow-image');
    const videoElement = document.getElementById('slideshow-video');
    const imageLink = document.getElementById('image-link');
    const filenameDisplay = document.getElementById('filename-display');
    const toggleButton = document.getElementById('toggle-play');

    // --- データ取得と初期化 ---
    const data = JSON.parse(document.getElementById('slideshow-data').textContent);
    const { image_files, start_index, duration, loop, base_img_url } = data;
    let currentIndex = start_index;
    let timer = null; // スライド切り替え用タイマーID
    let isPlaying = true;

    // --- 補助関数 ---

    /**
     * すべてのアクティブなタイマーをクリアする
     */
    function clearSlideTimer() {
        if (timer !== null) {
            clearTimeout(timer);
            timer = null;
        }
    }

    /**
     * 全画面表示になっている場合は安全に解除する
     */
    function exitFullscreenIfActive() {
        if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(function() {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }

    // --- メイン関数 ---

    /**
     * 指定されたインデックスのメディアをバックグラウンドで事前読み込み（プリロード）する
     * @param {number} idx - プリロードするメディアのインデックス
     */
    function preloadImageByIndex(idx) {
        if (idx < 0 || idx >= image_files.length) return;
        const fn = image_files[idx];
        if (!fn.toLowerCase().endsWith('.mp4')) {
            const img = new Image();
            img.src = `${base_img_url}${fn}`;
        }
    }

    /**
     * 指定されたインデックスのメディア（画像または動画）を表示する
     * @param {number} index - 表示するメディアのインデックス
     */
    function showImage(index) {
        if (index < 0 || index >= image_files.length) {
            console.error('Invalid image index:', index);
            return;
        }

        clearSlideTimer();
        exitFullscreenIfActive();

        currentIndex = index;
        const filename = image_files[index];
        const isVideo = filename.toLowerCase().endsWith('.mp4');
        const mediaUrl = `${base_img_url}${filename}`;

        filenameDisplay.textContent = filename;

        // 次と前の画像ファイルをプリロードして表示の遅延を抑止
        if (image_files.length > 1) {
            const nextIdx = (index + 1) % image_files.length;
            const prevIdx = (index - 1 + image_files.length) % image_files.length;
            preloadImageByIndex(nextIdx);
            preloadImageByIndex(prevIdx);
        }

        if (isVideo) {
            // 画像表示を隠す
            imageLink.classList.add('d-none');
            imageElement.src = '';

            // 動画要素を設定
            videoElement.classList.remove('d-none');
            videoElement.muted = true;
            videoElement.defaultMuted = true;
            videoElement.playsInline = true;
            videoElement.setAttribute('playsinline', '');
            videoElement.setAttribute('webkit-playsinline', '');
            videoElement.src = mediaUrl;
            videoElement.currentTime = 0;

            if (isPlaying) {
                const playPromise = videoElement.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function(error) {
                        console.log("Auto-play prevented or failed: ", error);
                        // 自動再生が拒否された場合、スライドショーが停止しないよう設定時間後に次へ進む
                        if (isPlaying && timer === null) {
                            timer = setTimeout(nextImage, duration);
                        }
                    });
                }
            } else {
                videoElement.pause();
            }
        } else {
            // 動画を停止して非表示・リソース解放
            videoElement.pause();
            videoElement.removeAttribute('src');
            videoElement.load();
            videoElement.classList.add('d-none');

            // 画像を表示
            imageLink.classList.remove('d-none');
            imageElement.src = mediaUrl;
            imageElement.alt = filename;
            imageLink.href = `/image/${filename}`;

            if (isPlaying) {
                timer = setTimeout(nextImage, duration);
            }
        }
    }

    /**
     * スライドショーを次のメディアに進める
     */
    function nextImage() {
        let nextIndex = currentIndex + 1;

        if (nextIndex >= image_files.length) {
            if (loop) {
                nextIndex = 0;
            } else {
                stopSlideshow();
                return;
            }
        }
        showImage(nextIndex);
    }

    /**
     * スライドショーを開始（再開）する
     */
    function startSlideshow() {
        isPlaying = true;
        toggleButton.textContent = '一時停止';

        const filename = image_files[currentIndex];
        const isVideo = filename.toLowerCase().endsWith('.mp4');

        if (isVideo) {
            videoElement.muted = true;
            const playPromise = videoElement.play();
            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    console.log("Start slideshow play failed: ", error);
                    if (isPlaying && timer === null) {
                        timer = setTimeout(nextImage, duration);
                    }
                });
            }
        } else {
            if (timer === null) {
                timer = setTimeout(nextImage, duration);
            }
        }
    }

    /**
     * スライドショーを停止する
     */
    function stopSlideshow() {
        clearSlideTimer();
        isPlaying = false;
        toggleButton.textContent = '再生';
        videoElement.pause();
    }

    /**
     * 再生/一時停止を切り替える
     */
    function togglePlay() {
        if (isPlaying) {
            stopSlideshow();
        } else {
            startSlideshow();
        }
    }

    /**
     * 手動でスライドを移動する (n=1で次、n=-1で前)
     * @param {number} n
     */
    function plusSlides(n) {
        const wasPlaying = isPlaying;
        if (wasPlaying) {
            stopSlideshow();
        }

        let newIndex = currentIndex + n;
        if (newIndex >= image_files.length) {
            newIndex = 0;
        } else if (newIndex < 0) {
            newIndex = image_files.length - 1;
        }

        showImage(newIndex);

        if (wasPlaying) {
            startSlideshow();
        }
    }

    // --- イベントリスナー ---
    toggleButton.addEventListener('click', togglePlay);

    // 動画再生終了時に自動的に次のメディアへ進む
    videoElement.addEventListener('ended', function() {
        if (isPlaying) {
            nextImage();
        }
    });

    // 動画読み込み・再生エラー時のフォールバック処理
    videoElement.addEventListener('error', function() {
        console.log('Video error occurred');
        if (isPlaying && timer === null) {
            timer = setTimeout(nextImage, duration);
        }
    });

    // --- 初期化処理 ---
    showImage(currentIndex);
    if (isPlaying) {
        startSlideshow();
    }
</script>

<style>
    .slideshow-container {
        position: relative;
        margin: auto;
    }

    .prev, .next {
        cursor: pointer;
        position: absolute;
        top: 50%;
        width: auto;
        padding: 16px;
        margin-top: -22px;
        color: white;
        font-weight: bold;
        font-size: 20px;
        transition: 0.6s ease;
        border-radius: 0 3px 3px 0;
        user-select: none;
        background-color: rgba(0,0,0,0.3);
    }

    .next {
        right: 0;
        border-radius: 3px 0 0 3px;
    }
    
    .prev {
        left: 0;
    }

    .prev:hover, .next:hover {
        background-color: rgba(0,0,0,0.8);
    }
</style>
{% endblock %}
